name: service-desk-web

# The web app in its production image. The browser calls the API on the host port,
# so start the backend first: `cd ../backend && docker compose --profile app up -d --build`.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - "3000:3000"
    restart: unless-stopped
